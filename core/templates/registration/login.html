<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Login — Mini Supermarket Chain</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 16px; color: #1a1a1a; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px 28px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 18px; }
    .errorlist { color: #b3261e; list-style: none; padding: 0; }
  </style>
</head>
<body>
  <h1>Staff Login</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
